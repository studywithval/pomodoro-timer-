<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Anime Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>

    <div class="timer-container">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTZjMDliOTUydW1vZ2RqcjkyZjlkeGowZmsxaWgyNmZrcG9oOGNxNGJydDNreXhkayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/6rHfF5HqcnQpq/giphy.gif" alt="Cute Anime Cat" class="anime-gif">
        
        <h1 id="timer-display">25:00</h1>
        
        <div class="button-group">
            <button id="start-btn">Start ✨</button>
            <button id="pause-btn">Pause ⏱️</button>
            <button id="reset-btn">Reset 🌸</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
