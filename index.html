<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozy Dachshund Focus — ADHD-friendly Pomodoro</title>
<meta name="description" content="A gentle, dachshund-themed Pomodoro timer built for ADHD brains: one step at a time, flexible timers, and dopamine-friendly rewards.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="top-row">
      <h1 class="app-title">Cozy Dachshund Focus</h1>
      <button class="icon-btn" id="sound-btn" title="Toggle sound" aria-label="Toggle sound">🔔</button>
    </header>

    <div class="mode-row" role="tablist" aria-label="Timer mode">
      <button class="mtab active" data-mode="focus" id="tab-focus" role="tab" aria-selected="true">focus</button>
      <button class="mtab" data-mode="short" id="tab-short" role="tab" aria-selected="false">short break</button>
      <button class="mtab" data-mode="long" id="tab-long" role="tab" aria-selected="false">long break</button>
    </div>

    <div class="length-row" id="length-row"></div>

    <div class="timer-display">
      <span class="time-txt" id="disp">25:00</span>
      <div class="nudge-row">
        <button class="nudge-btn" id="minus-btn" title="1 minute less">−1m</button>
        <button class="nudge-btn" id="plus-btn" title="1 minute more">+1m</button>
      </div>
    </div>

    <div class="phase-badge" id="phase-lbl">focus time</div>

    <div class="cat-scene" id="cat-scene">
      <svg viewBox="0 0 300 320" aria-hidden="true" id="room-svg" preserveAspectRatio="xMidYMax slice">
        <defs>
          <radialGradient id="gradDog" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#c99a6b"/>
            <stop offset="100%" stop-color="#8a5a34"/>
          </radialGradient>
          <pattern id="sweaterStripe" width="9" height="9" patternUnits="userSpaceOnUse">
            <rect width="9" height="9" fill="#f5efe0"/>
            <rect width="9" height="2.5" y="3.25" fill="#a8c4d8"/>
          </pattern>
          <linearGradient id="gradWood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#e3ba8d"/>
            <stop offset="100%" stop-color="#c99668"/>
          </linearGradient>
          <linearGradient id="gradFloor" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#dcebde"/>
            <stop offset="100%" stop-color="#c3dac6"/>
          </linearGradient>
          <pattern id="chairStripe" width="14" height="14" patternUnits="userSpaceOnUse">
            <rect width="14" height="14" fill="var(--stripe-white)"/>
            <rect width="7" height="14" fill="var(--stripe-pink)"/>
          </pattern>
          <pattern id="rugStripe" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="16" height="16" fill="var(--stripe-white)"/>
            <rect width="8" height="16" fill="var(--stripe-pink)" opacity="0.8"/>
          </pattern>
        </defs>

        <rect x="0" y="0" width="300" height="215" fill="var(--wall)"/>
        <rect x="0" y="215" width="300" height="105" fill="url(#gradFloor)"/>
        <rect x="0" y="213" width="300" height="4" fill="var(--floor-trim)"/>

        <!-- wall art: paw print frame -->
        <rect x="18" y="20" width="50" height="60" rx="4" fill="var(--accent)"/>
        <rect x="24" y="26" width="38" height="48" rx="2" fill="var(--cream)"/>
        <ellipse cx="43" cy="56" rx="7.5" ry="5.5" fill="var(--dog-copper)"/>
        <circle cx="34" cy="43" r="3.8" fill="var(--dog-copper)"/>
        <circle cx="43" cy="39" r="4.2" fill="var(--dog-copper)"/>
        <circle cx="52" cy="43" r="3.8" fill="var(--dog-copper)"/>

        <!-- little bow on the wall -->
        <path d="M18 105 L8 96 L8 114 Z" fill="var(--accent)"/>
        <path d="M26 105 L36 96 L36 114 Z" fill="var(--accent)"/>
        <circle cx="22" cy="105" r="4" fill="var(--accent-dark)"/>

        <!-- book stack -->
        <g>
          <rect x="8" y="296" width="58" height="13" rx="2" fill="var(--mint)" transform="rotate(-2 37 302)"/>
          <rect x="10" y="283" width="53" height="13" rx="2" fill="var(--accent)" transform="rotate(1.5 37 289)"/>
          <rect x="8" y="270" width="56" height="13" rx="2" fill="#e3b95e" transform="rotate(-1.5 36 276)"/>
          <rect x="12" y="257" width="46" height="13" rx="2" fill="var(--mint-dark)" transform="rotate(2 35 263)"/>
          <rect x="14" y="245" width="38" height="12" rx="2" fill="var(--cream)" stroke="var(--accent)" stroke-width="2" transform="rotate(-1 33 251)"/>
        </g>

        <!-- side table with plaid lamp and mug -->
        <g>
          <ellipse cx="271" cy="283" rx="19" ry="6" fill="var(--wood-darker)" opacity="0.5"/>
          <rect x="266" y="251" width="10" height="32" rx="3" fill="var(--wood-dark)"/>
          <ellipse cx="271" cy="251" rx="25" ry="7" fill="var(--wood-dark)"/>
          <rect x="268" y="217" width="5" height="34" fill="var(--wood-darker)"/>
          <path d="M255 217 L289 217 L281 193 L263 193 Z" fill="var(--lamp-shade)"/>
          <line x1="264" y1="204" x2="280" y2="204" stroke="var(--wood-darker)" stroke-width="1.3" opacity="0.5"/>
          <line x1="266" y1="196" x2="261" y2="215" stroke="var(--wood-darker)" stroke-width="1.3" opacity="0.5"/>
          <line x1="272" y1="196" x2="272" y2="215" stroke="var(--wood-darker)" stroke-width="1.3" opacity="0.5"/>
          <line x1="278" y1="196" x2="283" y2="215" stroke="var(--wood-darker)" stroke-width="1.3" opacity="0.5"/>
          <circle cx="271" cy="205" r="13" fill="#ffe9a8" opacity="0.3"/>
          <path d="M254 249 L254 235 Q254 231 258 231 Q262 231 262 235 L262 249 Z" fill="var(--cream)"/>
          <path d="M262 236 Q268 236 268 241 Q268 246 262 245" fill="none" stroke="var(--cream)" stroke-width="2.5"/>
          <circle cx="258" cy="240" r="2.3" fill="var(--accent)"/>
        </g>

        <!-- striped rug -->
        <rect x="55" y="260" width="200" height="52" rx="12" fill="url(#rugStripe)" transform="rotate(-1.5 155 286)"/>

        <!-- bergere armchair -->
        <g>
          <rect x="98" y="253" width="132" height="18" rx="8" fill="var(--wood)"/>
          <rect x="116" y="271" width="11" height="30" rx="5" fill="var(--wood-darker)"/>
          <rect x="195" y="271" width="11" height="30" rx="5" fill="var(--wood-darker)"/>
          <path d="M75 190 Q68 230 78 262 L96 262 Q90 225 95 188 Z" fill="url(#gradWood)"/>
          <path d="M235 190 Q242 230 232 262 L214 262 Q220 225 215 188 Z" fill="url(#gradWood)"/>
          <path d="M92 150 Q92 130 110 126 L220 126 Q238 130 238 150 L238 250 Q238 258 228 258 L102 258 Q92 258 92 250 Z" fill="url(#chairStripe)" stroke="var(--wood)" stroke-width="6"/>
          <ellipse cx="165" cy="128" rx="72" ry="14" fill="var(--wood)"/>
          <ellipse cx="165" cy="120" rx="10" ry="6" fill="var(--wood-dark)"/>
          <ellipse cx="160" cy="118" rx="3.5" ry="2.5" fill="var(--wood-darker)"/>
          <circle cx="152" cy="120" r="1.8" fill="var(--wood-darker)"/>
          <circle cx="160" cy="115" r="1.8" fill="var(--wood-darker)"/>
          <circle cx="168" cy="120" r="1.8" fill="var(--wood-darker)"/>
        </g>

        <!-- interactive dachshund -->
        <g id="cat-svg" class="state-focus"></g>
      </svg>
      <div class="sparkle-layer" id="sparkle-layer"></div>
    </div>

    <div class="btn-row">
      <button class="bigbtn start-btn" id="startbtn">start</button>
      <button class="bigbtn reset-btn" id="resetbtn">reset</button>
      <button class="bigbtn skip-btn" id="skipbtn">skip</button>
    </div>

    <div class="dots-row" id="dots"></div>

    <div class="stats-row">
      <span id="streak-lbl">🔥 0 day streak</span>
      <span id="today-lbl">0 sessions today</span>
    </div>

    <div class="break-card" id="break-card" hidden>
      <p class="break-title">break idea</p>
      <p class="break-idea" id="break-idea">stretch like a pup</p>
      <span class="break-tag" id="break-tag">movement</span>
      <button class="shuffle-btn" id="shuffle-btn">🔀 new idea</button>
    </div>

    <section class="focus-card">
      <p class="focus-label">right now, focus on:</p>
      <p class="current-step" id="current-step">nothing set yet — add a step below</p>
      <div class="task-row">
        <input type="text" id="task-in" placeholder="break your task into a tiny step" maxlength="60">
        <button id="add-btn">add</button>
      </div>
      <button class="next-step-btn" id="next-step-btn" hidden>done with this step → next</button>
      <details class="steps-details">
        <summary>all steps (<span id="step-count">0</span>)</summary>
        <div class="task-list" id="task-list"></div>
      </details>
    </section>

    <div class="toast" id="toast"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
